version: '3.8'

services:
  # 1. PostgreSQL 16 Relational Database with Row-Level Security
  db:
    image: postgres:16-alpine
    container_name: subseaflow_db
    environment:
      POSTGRES_DB: subseaflow_db
      POSTGRES_USER: subsea_admin
      POSTGRES_PASSWORD: subsea_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subsea_admin -d subseaflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & Cache for Asynchronous Celery Tasks
  redis:
    image: redis:7-alpine
    container_name: subseaflow_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 3. Frontend Interactive CAD Console (Vite React 19)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subseaflow_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
